<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1710" viewBox="0 0 1400 1710" lang="ru"><title>Благодарственная грамота — НЕОФИЦИАЛЬНЫЙ ПЕРЕВОД</title><rect width="1400" height="1710" fill="#f5f1e9"/><rect x="35" y="35" width="1330" height="1640" rx="22" fill="none" stroke="#b58a5e" stroke-width="2"/><rect x="35" y="35" width="1330" height="165" rx="22" fill="#183438"/><text x="95" y="109" font-family="Noto Sans, Vazirmatn" font-size="31" font-weight="700" fill="#e2b67f">НЕОФИЦИАЛЬНЫЙ ПЕРЕВОД</text><text x="95" y="160" font-family="Noto Sans, Vazirmatn" font-size="22" font-weight="400" fill="#f5f1e9">UNOFFICIAL TRANSLATION / PORTFOLIO COPY</text><text x="95" y="300" font-family="Noto Sans, Vazirmatn" font-size="54" font-weight="700" fill="#183438">Благодарственная грамота</text><text x="95" y="368" font-family="Noto Sans, Vazirmatn" font-size="36" font-weight="700" fill="#183438">За написание книги</text><path d="M95 410H1305" stroke="#b58a5e" stroke-width="2"/><text x="110" y="480" font-family="Noto Sans, Vazirmatn" font-size="29" font-weight="400" fill="#183438">Во имя Всевышнего</text><text x="110" y="550" font-family="Noto Sans, Vazirmatn" font-size="29" font-weight="400" fill="#183438">«Нун. Клянусь пером и тем, что они пишут».</text><text x="110" y="595" font-family="Noto Sans, Vazirmatn" font-size="29" font-weight="400" fill="#183438">Коран, сура «Письменная трость», аят 1</text><text x="110" y="665" font-family="Noto Sans, Vazirmatn" font-size="29" font-weight="400" fill="#183438">Уважаемый господин Бардия Ализаде!</text><text x="110" y="710" font-family="Noto Sans, Vazirmatn" font-size="29" font-weight="400" fill="#183438">Мир вам.</text><text x="110" y="780" font-family="Noto Sans, Vazirmatn" font-size="29" font-weight="400" fill="#183438">Книга — врата в обширный мир знаний и понимания. Предоставлять людям</text><text x="110" y="825" font-family="Noto Sans, Vazirmatn" font-size="29" font-weight="400" fill="#183438">хорошие книги — один из лучших способов помогать им раскрыть свой</text><text x="110" y="870" font-family="Noto Sans, Vazirmatn" font-size="29" font-weight="400" fill="#183438">потенциал.</text><text x="110" y="940" font-family="Noto Sans, Vazirmatn" font-size="29" font-weight="400" fill="#183438">Настоящим выражаем искреннюю благодарность и признательность за ваши</text><text x="110" y="985" font-family="Noto Sans, Vazirmatn" font-size="29" font-weight="400" fill="#183438">неустанные и значимые усилия по написанию ценной книги Visual Animation</text><text x="110" y="1030" font-family="Noto Sans, Vazirmatn" font-size="29" font-weight="400" fill="#183438">Tutorial (آموزش انیمیشن سازی تصویری). Просим Всемогущего даровать вам</text><text x="110" y="1075" font-family="Noto Sans, Vazirmatn" font-size="29" font-weight="400" fill="#183438">почёт и возрастающие успехи на протяжении всей жизни.</text><text x="110" y="1145" font-family="Noto Sans, Vazirmatn" font-size="29" font-weight="400" fill="#183438">Али Наримани</text><text x="110" y="1190" font-family="Noto Sans, Vazirmatn" font-size="29" font-weight="400" fill="#183438">Заместитель генерального директора и руководитель управления</text><text x="110" y="1235" font-family="Noto Sans, Vazirmatn" font-size="29" font-weight="400" fill="#183438">образования Мараге</text><text x="110" y="1305" font-family="Noto Sans, Vazirmatn" font-size="29" font-weight="400" fill="#183438">Дата: 1404/09/09 (солнечная хиджра)</text><text x="110" y="1350" font-family="Noto Sans, Vazirmatn" font-size="29" font-weight="400" fill="#183438">Регистрационный номер: см. исходную фотографию; неясные цифры не</text><text x="110" y="1395" font-family="Noto Sans, Vazirmatn" font-size="29" font-weight="400" fill="#183438">восстановлены.</text><path d="M95 1540H1305" stroke="#b58a5e"/><text x="95" y="1590" font-family="Noto Sans, Vazirmatn" font-size="22" font-weight="400" fill="#183438">Даты по солнечной хиджре. Печати и подписи не воспроизведены.</text><text x="95" y="1630" font-family="Noto Sans, Vazirmatn" font-size="22" font-weight="400" fill="#183438">Приоритет имеет оригинал. Это не повторно выданный официальный документ.</text><text x="95" y="1665" font-family="Noto Sans, Vazirmatn" font-size="17" font-weight="400" fill="#7b654c">Farland_game · Portfolio reference</text></svg>