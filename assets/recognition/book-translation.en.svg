<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1700" viewBox="0 0 1400 1700" lang="en"><title>Certificate of appreciation — UNOFFICIAL READING COPY</title><rect width="1400" height="1700" fill="#f5f1e9"/><rect x="35" y="35" width="1330" height="1630" rx="22" fill="none" stroke="#b58a5e" stroke-width="2"/><rect x="35" y="35" width="1330" height="165" rx="22" fill="#183438"/><text x="95" y="109" font-family="Noto Sans, Vazirmatn" font-size="31" font-weight="700" fill="#e2b67f">UNOFFICIAL READING COPY</text><text x="95" y="160" font-family="Noto Sans, Vazirmatn" font-size="22" font-weight="400" fill="#f5f1e9">PORTFOLIO TRANSLATION / TRANSCRIPTION</text><text x="95" y="300" font-family="Noto Sans, Vazirmatn" font-size="54" font-weight="700" fill="#183438">Certificate of appreciation</text><text x="95" y="368" font-family="Noto Sans, Vazirmatn" font-size="36" font-weight="700" fill="#183438">For authoring a book</text><path d="M95 410H1305" stroke="#b58a5e" stroke-width="2"/><text x="110" y="480" font-family="Noto Sans, Vazirmatn" font-size="29" font-weight="400" fill="#183438">In the name of the Most High</text><text x="110" y="550" font-family="Noto Sans, Vazirmatn" font-size="29" font-weight="400" fill="#183438">“Nūn. By the pen and what they write.”</text><text x="110" y="595" font-family="Noto Sans, Vazirmatn" font-size="29" font-weight="400" fill="#183438">Qur’an, Surah Al-Qalam, verse 1</text><text x="110" y="665" font-family="Noto Sans, Vazirmatn" font-size="29" font-weight="400" fill="#183438">Dear Mr Bardiya Alizadeh,</text><text x="110" y="710" font-family="Noto Sans, Vazirmatn" font-size="29" font-weight="400" fill="#183438">Peace be upon you.</text><text x="110" y="780" font-family="Noto Sans, Vazirmatn" font-size="29" font-weight="400" fill="#183438">Books are a gateway to the vast world of knowledge and understanding, and</text><text x="110" y="825" font-family="Noto Sans, Vazirmatn" font-size="29" font-weight="400" fill="#183438">providing good books is one of the best means of helping people fulfil their</text><text x="110" y="870" font-family="Noto Sans, Vazirmatn" font-size="29" font-weight="400" fill="#183438">potential.</text><text x="110" y="940" font-family="Noto Sans, Vazirmatn" font-size="29" font-weight="400" fill="#183438">We hereby express our sincere thanks and appreciation for your tireless and</text><text x="110" y="985" font-family="Noto Sans, Vazirmatn" font-size="29" font-weight="400" fill="#183438">enduring efforts in authoring the valuable book Visual Animation Tutorial (آموزش</text><text x="110" y="1030" font-family="Noto Sans, Vazirmatn" font-size="29" font-weight="400" fill="#183438">انیمیشن سازی تصویری). We ask Almighty God to grant you honour and</text><text x="110" y="1075" font-family="Noto Sans, Vazirmatn" font-size="29" font-weight="400" fill="#183438">ever-growing success throughout your life.</text><text x="110" y="1145" font-family="Noto Sans, Vazirmatn" font-size="29" font-weight="400" fill="#183438">Ali Narimani</text><text x="110" y="1190" font-family="Noto Sans, Vazirmatn" font-size="29" font-weight="400" fill="#183438">Deputy Director-General and Director of Education, Maragheh</text><text x="110" y="1260" font-family="Noto Sans, Vazirmatn" font-size="29" font-weight="400" fill="#183438">Date: 1404/09/09 (Solar Hijri)</text><text x="110" y="1305" font-family="Noto Sans, Vazirmatn" font-size="29" font-weight="400" fill="#183438">Reference number: see original photograph; unclear digits are not reconstructed.</text><path d="M95 1530H1305" stroke="#b58a5e"/><text x="95" y="1580" font-family="Noto Sans, Vazirmatn" font-size="22" font-weight="400" fill="#183438">Dates retain the Solar Hijri calendar. No seal or signature is recreated.</text><text x="95" y="1620" font-family="Noto Sans, Vazirmatn" font-size="22" font-weight="400" fill="#183438">The supplied original is authoritative. This is not an official reissue.</text><text x="95" y="1655" font-family="Noto Sans, Vazirmatn" font-size="17" font-weight="400" fill="#7b654c">Farland_game · Portfolio reference</text></svg>