<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1700" viewBox="0 0 1400 1700" lang="ja"><title>感謝状 — 非公式の翻訳・閲覧用</title><rect width="1400" height="1700" fill="#f5f1e9"/><rect x="35" y="35" width="1330" height="1630" rx="22" fill="none" stroke="#b58a5e" stroke-width="2"/><rect x="35" y="35" width="1330" height="165" rx="22" fill="#183438"/><text x="95" y="109" font-family="Yu Gothic, Vazirmatn" font-size="31" font-weight="700" fill="#e2b67f">非公式の翻訳・閲覧用</text><text x="95" y="160" font-family="Yu Gothic, Vazirmatn" font-size="22" font-weight="400" fill="#f5f1e9">UNOFFICIAL TRANSLATION / PORTFOLIO COPY</text><text x="95" y="300" font-family="Yu Gothic, Vazirmatn" font-size="54" font-weight="700" fill="#183438">感謝状</text><text x="95" y="368" font-family="Yu Gothic, Vazirmatn" font-size="36" font-weight="700" fill="#183438">書籍執筆に対する表彰</text><path d="M95 410H1305" stroke="#b58a5e" stroke-width="2"/><text x="110" y="480" font-family="Yu Gothic, Vazirmatn" font-size="29" font-weight="400" fill="#183438">至高なる神の御名において</text><text x="110" y="550" font-family="Yu Gothic, Vazirmatn" font-size="29" font-weight="400" fill="#183438">「ヌーン。筆と、人々が書き記すものにかけて。」</text><text x="110" y="595" font-family="Yu Gothic, Vazirmatn" font-size="29" font-weight="400" fill="#183438">クルアーン、第68章「筆」、第1節</text><text x="110" y="665" font-family="Yu Gothic, Vazirmatn" font-size="29" font-weight="400" fill="#183438">Bardiya Alizadeh 様</text><text x="110" y="710" font-family="Yu Gothic, Vazirmatn" font-size="29" font-weight="400" fill="#183438">平安がありますように。</text><text x="110" y="780" font-family="Yu Gothic, Vazirmatn" font-size="29" font-weight="400" fill="#183438">本は知識と理解の広大な世界への入り口であり、良い本を届けることは、人々が持つ</text><text x="110" y="825" font-family="Yu Gothic, Vazirmatn" font-size="29" font-weight="400" fill="#183438">可能性を十分に伸ばすための優れた手段の一つです。</text><text x="110" y="895" font-family="Yu Gothic, Vazirmatn" font-size="29" font-weight="400" fill="#183438">このたび、価値ある書籍 Visual Animation Tutorial（آموزش انیمیشن سا</text><text x="110" y="940" font-family="Yu Gothic, Vazirmatn" font-size="29" font-weight="400" fill="#183438">زی تصویری）の執筆にあたり、惜しみなく重ねられた、後世に残るご尽力に心</text><text x="110" y="985" font-family="Yu Gothic, Vazirmatn" font-size="29" font-weight="400" fill="#183438">より感謝と敬意を表します。全能の神が、あなたの生涯にわたって栄誉とますますの</text><text x="110" y="1030" font-family="Yu Gothic, Vazirmatn" font-size="29" font-weight="400" fill="#183438">ご成功を授けてくださるよう祈念します。</text><text x="110" y="1100" font-family="Yu Gothic, Vazirmatn" font-size="29" font-weight="400" fill="#183438">Ali Narimani</text><text x="110" y="1145" font-family="Yu Gothic, Vazirmatn" font-size="29" font-weight="400" fill="#183438">副総局長・マラーゲ教育局長</text><text x="110" y="1215" font-family="Yu Gothic, Vazirmatn" font-size="29" font-weight="400" fill="#183438">日付：1404/09/09（太陽ヒジュラ暦）</text><text x="110" y="1260" font-family="Yu Gothic, Vazirmatn" font-size="29" font-weight="400" fill="#183438">文書番号：元の写真をご参照ください。不鮮明な数字は推測して補っていません。</text><path d="M95 1530H1305" stroke="#b58a5e"/><text x="95" y="1580" font-family="Yu Gothic, Vazirmatn" font-size="22" font-weight="400" fill="#183438">日付は太陽ヒジュラ暦です。印章・署名は複製していません。</text><text x="95" y="1620" font-family="Yu Gothic, Vazirmatn" font-size="22" font-weight="400" fill="#183438">原本をご参照ください。この画像は公的な再発行ではありません。</text><text x="95" y="1655" font-family="Yu Gothic, Vazirmatn" font-size="17" font-weight="400" fill="#7b654c">Farland_game · Portfolio reference</text></svg>